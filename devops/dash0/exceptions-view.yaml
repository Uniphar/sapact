apiVersion: operator.dash0.com/v1alpha1
kind: Dash0View
metadata:
  name: sapact-exceptions-__ENVIRONMENT__
  annotations:
    dash0.com/folder-path: "/SapAct"
  labels:
    dash0.com/id: sapact-exceptions-__ENVIRONMENT__
spec:
  type: spans
  display:
    name: Exceptions
    description: Spans with ERROR status for sapact services.
  filter:
    - key: service.name
      operator: is
      value: sapact
    - key: otel.span.status.code
      operator: is
      value: ERROR
    - key: error.type
      operator: does_not_match
      value: "\\d{3}|System\\.Threading\\.Tasks\\.TaskCanceledException"
    - key: otel.span.status.message
      operator: does_not_match
      value: ".*(TaskCanceledException|Connection reset by peer).*"
  table:
    columns:
      - colSize: min-content
        key: otel.span.start_time
        label: Start Time
      - colSize: minmax(auto, 1fr)
        key: dash0.span.name
        label: Operation
      - colSize: minmax(auto, 1fr)
        key: error.type
        label: Exception Type
      - colSize: minmax(auto, 2fr)
        key: otel.span.status.message
        label: Message
      - colSize: minmax(auto, 1fr)
        key: otel.trace.id
        label: Trace Id
      - key: dash0.view.builtin.span_events
    sort:
      - direction: descending
        key: otel.span.start_time
