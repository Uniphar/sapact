apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sapact-exception-logs-detected-__ENVIRONMENT__
  labels:
    dash0.com/id: sapact-exception-logs-detected-__ENVIRONMENT__
spec:
  groups:
    - name: SapAct
      interval: 5m
      rules:
        - alert: Exception Logs Detected (__ENVIRONMENT__)
          expr: sum(increase({otel_metric_name="dash0.logs", service_name="sapact", otel_log_severity_range=~"ERROR|FATAL", exception_type!~"TaskCanceledException|ObjectDisposedException", exception_message!~`.*(TaskCanceledException|Connection reset by peer).*`}[5m] anchored)) > 0
          for: 0s
          keep_firing_for: 15m
          annotations:
            summary: "Exception logs detected in sapact (__ENVIRONMENT__)"
            description: "One or more ERROR or FATAL log records were detected for sapact in __ENVIRONMENT__ within a 5-minute evaluation window. The alert remains firing for 15 minutes after the condition clears. Open the 'Only unexpected exceptions' view in the 'SapAct' folder in Logging to see them."
            dash0.com/notification-channel-ids: platform-apps-team-__ENVIRONMENT__
          labels:
            environment: __ENVIRONMENT__
            service: sapact
